<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המסעות של משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* sunset-over-ocean palette */
  --sky-indigo:#2b1b4c;
  --sky-purple:#5a3a7e;
  --magenta:#d6408f;
  --pink:#f19bc4;
  --sunset-orange:#ff8c5a;
  --gold:#ffc978;
  --ocean-deep:#241a3d;
  --navy:#2b2140;
  --muted:#8577a0;
  --shadow:0 18px 45px rgba(43,27,76,.22);
  --radius:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Heebo,sans-serif;
  background:
    radial-gradient(circle at top,#fdeaf4 0,#fff6ef 40%,#fffdfb 100%);
  color:var(--navy);
}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

.hero{
  padding:60px 20px 20px;
  background:
    linear-gradient(180deg,
      var(--sky-indigo) 0%,
      var(--sky-purple) 22%,
      var(--magenta) 48%,
      var(--sunset-orange) 70%,
      var(--gold) 88%,
      #fff6ef 100%);
  text-align:center;
}

.heroContent{
  margin-bottom:35px;
}

.heroContent h1{
  font-size:clamp(2.4rem,5vw,4rem);
  font-weight:900;
  color:#fff;
  text-shadow:0 4px 22px rgba(43,27,76,.45);
}

.heroContent p{
  margin-top:12px;
  font-size:1.15rem;
  color:#ffe3ef;
}

.heroPhoto{
  width:min(860px,90%);
  margin:70px auto 100px;

  border-radius:34px;
  overflow:hidden;

  background:#fff;
  border:8px solid #fff;

  box-shadow:
    0 15px 35px rgba(43,27,76,.18),
    0 35px 90px rgba(214,64,143,.28);

  animation:floatHero 8s ease-in-out infinite;

  transition:
    transform .4s ease,
    box-shadow .4s ease;

  cursor:pointer;
}

.heroPhoto:hover{
  transform:
    translateY(-8px)
    scale(1.02)
    rotate(-0.3deg);

  box-shadow:
    0 25px 55px rgba(43,27,76,.22),
    0 55px 130px rgba(214,64,143,.32);
}

.heroPhoto img{
  display:block;
  width:100%;
  height:auto;
}

@keyframes floatHero{
  0%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-10px) scale(1.015);
  }
  100%{
    transform:translateY(0) scale(1);
  }
}

main{
  max-width:1180px;
  margin:50px auto 60px;
  padding:0 20px;
}
.intro{text-align:center;margin-bottom:32px}
.intro h2{font-size:2rem}
.intro p{color:var(--muted)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:28px;
}
.card{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.35s;
}
.card:hover{
  transform:translateY(-10px) scale(1.02);
  box-shadow:0 24px 60px rgba(214,64,143,.28);
}
.cover{height:220px;overflow:hidden;position:relative}
.cover::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(43,27,76,0) 55%,rgba(43,27,76,.35) 100%);
}
.cover img{width:100%;height:100%;object-fit:cover;transition:.45s}
.card:hover .cover img{transform:scale(1.08)}
.content{padding:22px}
.flags{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.flags img{width:38px;height:26px;border:1px solid #f0dbe8;border-radius:4px}
.title{text-align:center;font-size:1.7rem;font-weight:800;color:var(--sky-indigo)}
.season{text-align:center;color:var(--muted);margin:12px 0 20px}
.btn{
  display:block;
  text-align:center;
  padding:15px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--magenta),var(--sunset-orange),var(--gold));
  color:#fff;
  font-weight:800;
  transition:.25s;
}
.card:hover .btn{transform:scale(1.04)}
footer{
  text-align:center;
  padding:28px;
  background:linear-gradient(180deg,#fff6ef,#fbe3ee);
  color:#8c5a86;
}
@media(max-width:700px){
  .hero{aspect-ratio:auto;height:60vh;min-height:340px}
  .hero img{object-fit:cover;object-position:center top}
  .heroContent{margin-top:80px}
}
</style>
</head>
<body>
<header class="hero">

  <div class="heroContent">
    <h1>🌍 המסעות של משפחת כהן</h1>
    <p>כל הטיולים שלנו במקום אחד</p>
  </div>

  <div class="heroPhoto">
    <img src="hero-family.png" alt="משפחת כהן">
  </div>

</header>

<main>
<div class="intro">
<h2>✈️ בחרו את הטיול הבא</h2>
<p>שלושה מסעות · אינספור זיכרונות</p>
</div>

<div class="grid">

<a class="card" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags">
<img src="at.png" alt="Austria">
<img src="hu.png" alt="Hungary">
</div>
<div class="title">וינה • בודפשט</div>
<div class="season">☀️ קיץ 2026</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags"><img src="cz.png" alt="Czechia"></div>
<div class="title">פראג</div>
<div class="season">🎄 כריסמס 2026</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags"><img src="nl.png" alt="Netherlands"></div>
<div class="title">אמסטרדם והולנד</div>
<div class="season">🌷 פסח 2027</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

</div>
</main>
<footer>❤️ משפחת כהן · 2026</footer>
</body>
</html>
