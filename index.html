<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טיולי משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#fff6f8;--pink:#f8bfd3;--rose:#e65182;--gold:#f5c66a;--navy:#24324a;
--shadow:0 18px 40px rgba(0,0,0,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Heebo,sans-serif;background:linear-gradient(#fff8fb,#ffe8ef,#fff);color:var(--navy)}
.hero{position:relative;height:min(60vw,560px);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(255,248,251,.98))}
main{max-width:1150px;margin:-70px auto 0;padding:0 20px 60px;position:relative;z-index:2}
.head{text-align:center;margin-bottom:28px}
.head h2{font-size:2rem}
.head p{color:#6f6f85}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:28px}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-radius:24px;overflow:hidden;
box-shadow:var(--shadow);transition:.3s;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-8px)}
.cover{height:210px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .cover img{transform:scale(1.06)}
.content{padding:24px}
.flags{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.flags img{width:36px;height:24px;object-fit:cover;border-radius:4px;border:1px solid #eee}
.title{text-align:center;font-size:1.7rem;font-weight:800}
.season{text-align:center;color:#6f6f85;margin:10px 0 22px}
.btn{display:block;text-align:center;background:linear-gradient(90deg,var(--pink),var(--gold));
padding:14px;border-radius:999px;font-weight:800;color:var(--navy)}
footer{text-align:center;padding:30px;background:#fff0f5;color:#8a5570}
</style>
</head>
<body>

<header class="hero">
<img src="hero-family.png" alt="טיולי משפחת כהן">
</header>

<main>
<div class="head">
<h2>✈️ בחרו את הטיול הבא</h2>
<p>שלושה מסעות, אינספור זיכרונות</p>
</div>

<div class="grid">

<a class="card" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1200&q=80"></div>
<div class="content">
<div class="flags">
<img src="au.jpg"><img src="hu.jpg">
</div>
<div class="title">וינה • בודפשט</div>
<div class="season">קיץ 2026 ☀️</div>
<div class="btn">לצפייה במסלול</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1200&q=80"></div>
<div class="content">
<div class="flags">
<img src="cz.jpg">
</div>
<div class="title">פראג</div>
<div class="season">כריסמס 2026 🎄</div>
<div class="btn">לצפייה במסלול</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1200&q=80"></div>
<div class="content">
<div class="flags">
<img src="nl.jpg">
</div>
<div class="title">אמסטרדם והולנד</div>
<div class="season">פסח 2027 🌷</div>
<div class="btn">לצפייה במסלול</div>
</div>
</a>

</div>
</main>

<footer>❤️ משפחת כהן · 2026</footer>
</body>
</html>
