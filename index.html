<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המסעות של משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* palette matched to the hero family photo */
  --sky-indigo:#7d6a93;
  --sky-purple:#a98fa8;
  --magenta:#e0a3ae;
  --pink:#f3c6b2;
  --sunset-orange:#f6c98a;
  --gold:#fbe7bd;
  --ocean-deep:#4a3f5c;
  --navy:#4a3f5c;
  --muted:#8c8298;
  --shadow:0 18px 45px rgba(74,63,92,.2);
  --radius:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Heebo,sans-serif;
  background:
    radial-gradient(circle at top,#fdeaf4 0,#fff6ef 40%,#fffdfb 100%);
  color:var(--navy);
}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

.hero{
  position:relative;
  padding:60px 20px 20px;
  background:
    linear-gradient(180deg,
      var(--sky-indigo) 0%,
      var(--sky-purple) 22%,
      var(--magenta) 48%,
      var(--sunset-orange) 70%,
      var(--gold) 88%,
      #fff6ef 100%);
  text-align:center;
  overflow:hidden;
}

.heroScene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}

.heroContent,.heroPhoto{position:relative;z-index:1}

.heroContent{
  margin-bottom:35px;
}

.heroContent h1{
  font-size:clamp(2.4rem,5vw,4rem);
  font-weight:900;
  color:#fff;
  text-shadow:0 4px 22px rgba(74,63,92,.45);
}

.heroContent p{
  margin-top:12px;
  font-size:1.15rem;
  color:#fdeadd;
}

.heroPhoto{
  width:min(860px,90%);
  margin:70px auto 100px;

  border-radius:34px;
  overflow:hidden;

  background:#fff;
  border:8px solid #fff;

  box-shadow:
    0 15px 35px rgba(74,63,92,.18),
    0 35px 90px rgba(157,110,140,.28);

  animation:floatHero 8s ease-in-out infinite;

  transition:
    transform .4s ease,
    box-shadow .4s ease;

  cursor:pointer;
}

.heroPhoto:hover{
  transform:
    translateY(-8px)
    scale(1.02)
    rotate(-0.3deg);

  box-shadow:
    0 25px 55px rgba(74,63,92,.22),
    0 55px 130px rgba(157,110,140,.32);
}

.heroPhoto img{
  display:block;
  width:100%;
  height:auto;
}

@keyframes floatHero{
  0%{
    transform:translateY(0) scale(1);
  }
  50%{
    transform:translateY(-10px) scale(1.015);
  }
  100%{
    transform:translateY(0) scale(1);
  }
}

main{
  max-width:1180px;
  margin:50px auto 60px;
  padding:0 20px;
}
.intro{text-align:center;margin-bottom:32px}
.intro h2{font-size:2rem}
.intro p{color:var(--muted)}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:28px;
}
.card{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:.35s;
}
.card:hover{
  transform:translateY(-10px) scale(1.02);
  box-shadow:0 24px 60px rgba(157,110,140,.28);
}
.cover{height:220px;overflow:hidden;position:relative}
.cover::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(74,63,92,0) 55%,rgba(74,63,92,.35) 100%);
}
.cover img{width:100%;height:100%;object-fit:cover;transition:.45s}
.card:hover .cover img{transform:scale(1.08)}

.nextBadge{
  position:absolute;
  top:16px;
  right:16px;
  z-index:2;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 16px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--magenta),var(--sunset-orange));
  color:#fff;
  font-weight:800;
  font-size:.85rem;
  box-shadow:0 8px 20px rgba(157,110,140,.4);
  animation:pulseBadge 2.2s ease-in-out infinite;
}
@keyframes pulseBadge{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

.content{padding:22px}
.flags{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.flags img{width:38px;height:26px;border:1px solid #f0dbe8;border-radius:4px}
.title{text-align:center;font-size:1.7rem;font-weight:800;color:var(--sky-indigo)}
.season{text-align:center;color:var(--muted);margin:12px 0 20px}

.countdown{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:0 0 20px;
}
.countdown .unit{
  min-width:56px;
  text-align:center;
  background:rgba(157,110,140,.08);
  border:1px solid rgba(157,110,140,.18);
  border-radius:14px;
  padding:8px 4px;
}
.countdown .num{
  display:block;
  font-size:1.3rem;
  font-weight:800;
  color:var(--sky-indigo);
}
.countdown .lbl{
  display:block;
  font-size:.7rem;
  color:var(--muted);
  margin-top:2px;
}
.btn{
  display:block;
  text-align:center;
  padding:15px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--magenta),var(--sunset-orange),var(--gold));
  color:#fff;
  font-weight:800;
  transition:.25s;
}
.card:hover .btn{transform:scale(1.04)}
footer{
  text-align:center;
  padding:28px;
  background:linear-gradient(180deg,#fff6ef,#f6e2e0);
  color:#6b5a68;
}
@media(max-width:700px){
  .hero{padding:40px 16px 10px}
  .heroContent{margin-bottom:24px}
  .heroPhoto{margin:40px auto 60px}
}


/* Center Quick Links */
.quick-links{
display:flex;
justify-content:center;
gap:22px;
margin:-40px auto 45px;
position:relative;
z-index:20;
}
.quick-btn{
width:84px;
height:84px;
border-radius:50%;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
box-shadow:0 12px 30px rgba(0,0,0,.22);
transition:.3s;
}
.quick-btn:hover{
transform:translateY(-6px) scale(1.08);
box-shadow:0 18px 40px rgba(0,0,0,.3);
}
.quick-btn img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

</style>
</head>

<script>
function updateCountdowns(){
  const now = new Date();
  document.querySelectorAll('.countdown').forEach(el=>{
    const target = new Date(el.dataset.flight);
    let diff = target - now;

    if(diff <= 0){
      el.innerHTML = '<div class="unit" style="min-width:auto;padding:8px 18px"><span class="num">✈️</span><span class="lbl">בדרכים!</span></div>';
      return;
    }

    const day = 1000*60*60*24;
    const days = Math.floor(diff/day);
    diff -= days*day;
    const hours = Math.floor(diff/(1000*60*60));
    diff -= hours*(1000*60*60);
    const mins = Math.floor(diff/(1000*60));

    el.innerHTML = `
      <div class="unit"><span class="num">${days}</span><span class="lbl">ימים</span></div>
      <div class="unit"><span class="num">${hours}</span><span class="lbl">שעות</span></div>
      <div class="unit"><span class="num">${mins}</span><span class="lbl">דקות</span></div>
    `;
  });
}
updateCountdowns();
setInterval(updateCountdowns, 60000);
</script>
