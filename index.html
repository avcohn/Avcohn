<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>טיולי משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--pink:#f7b2c9;
--rose:#ffd9e8;
--peach:#ffc89a;
--sun:#ff8f70;
--gold:#ffd66b;
--navy:#24324a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Heebo,sans-serif;
background:
radial-gradient(circle at top,#ffd9e8 0%,#ffc89a 30%,#ff8f70 65%,#24324a 100%);
min-height:100vh;color:#fff;overflow-x:hidden}
body:before{
content:"";position:fixed;inset:0;
background:
radial-gradient(rgba(255,255,255,.18),transparent 60%) 10% 10%/180px 180px,
radial-gradient(rgba(255,182,193,.15),transparent 60%) 80% 30%/220px 220px;
pointer-events:none}
.hero{
padding:90px 20px 60px;
text-align:center}
.hero h1{
font-size:clamp(42px,7vw,72px);
font-weight:800;
text-shadow:0 8px 30px rgba(0,0,0,.3)}
.hero p{font-size:1.35rem;margin-top:14px;opacity:.95}
.grid{
max-width:1200px;margin:20px auto 80px;
display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:32px;padding:20px}
.card{
background:rgba(255,255,255,.14);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.25);
border-radius:28px;
overflow:hidden;
transition:.35s;
box-shadow:0 20px 45px rgba(0,0,0,.25)}
.card:hover{transform:translateY(-10px) scale(1.02)}
.card img{width:100%;height:240px;object-fit:cover}
.content{padding:28px;text-align:center}
h2{font-size:2rem;color:#fff}
.small{margin:8px 0 24px;color:#fff8}
a.btn{
display:inline-block;
padding:14px 30px;
border-radius:999px;
background:linear-gradient(90deg,var(--pink),var(--gold));
color:var(--navy);
text-decoration:none;
font-weight:800;
box-shadow:0 10px 30px rgba(0,0,0,.2)}
a.btn:hover{filter:brightness(1.05)}
footer{text-align:center;padding:30px;opacity:.8}
</style>
</head>
<body>
<section class="hero">
<div style="font-size:58px">🌸✈️🌅</div>
<h1>טיולי משפחת כהן</h1>
<p>כל טיול הוא עוד זיכרון משפחתי שנשאר לנצח</p>
</section>

<section class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1200&q=80">
<div class="content">
<h2>🇦🇹 וינה • 🇭🇺 בודפשט</h2>
<div class="small">קיץ 2026</div>
<a class="btn" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank">למסע שלנו →</a>
</div></div>

<div class="card">
<img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1200&q=80">
<div class="content">
<h2>🇨🇿 פראג</h2>
<div class="small">כריסמס 2026 🎄</div>
<a class="btn" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank">למסע שלנו →</a>
</div></div>

<div class="card">
<img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1200&q=80">
<div class="content">
<h2>🇳🇱 אמסטרדם והולנד</h2>
<div class="small">פסח 2027 🌷</div>
<a class="btn" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank">למסע שלנו →</a>
</div></div>
</section>

<footer>משפחת כהן © 2026 ❤️</footer>
</body>
</html>
