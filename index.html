<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המסעות של משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--pink:#f7bfd3;--gold:#f6c56d;--navy:#24324a;--muted:#69758b;
--shadow:0 18px 45px rgba(0,0,0,.18);--radius:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Heebo,sans-serif;
background:radial-gradient(circle at top,#ffe7f1 0,#fff8fb 35%,#fff 100%);
color:var(--navy);
}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}

.hero{
position:relative;
aspect-ratio:16/8;
min-height:420px;
max-height:760px;
overflow:hidden;
background:#efe6ea;
display:flex;
align-items:center;
justify-content:center;
}
.hero img{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:contain;
object-position:center center;
transform:scale(1.02);
animation:float 12s ease-in-out infinite alternate;
}
.hero:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.18),rgba(255,255,255,.78),#fff);
z-index:1;
}
.heroContent{
position:relative;
z-index:2;
text-align:center;
padding:20px;
margin-top:120px;
}
.heroContent h1{
font-size:clamp(2.2rem,5vw,4rem);
color:#fff;
text-shadow:0 4px 18px rgba(0,0,0,.45);
}
.heroContent p{
margin-top:10px;
font-size:1.15rem;
font-weight:600;
color:#fff;
text-shadow:0 2px 8px rgba(0,0,0,.4);
}
@keyframes float{
0%{transform:scale(1.02) translateY(0)}
100%{transform:scale(1.05) translateY(-8px)}
}
main{
max-width:1180px;
margin:-40px auto 60px;
padding:0 20px;
position:relative;
z-index:3;
}
.intro{text-align:center;margin-bottom:32px}
.intro h2{font-size:2rem}
.intro p{color:var(--muted)}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
gap:28px;
}
.card{
background:rgba(255,255,255,.82);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.7);
border-radius:var(--radius);
overflow:hidden;
box-shadow:var(--shadow);
transition:.35s;
}
.card:hover{transform:translateY(-10px) scale(1.02)}
.cover{height:220px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;transition:.45s}
.card:hover .cover img{transform:scale(1.08)}
.content{padding:22px}
.flags{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.flags img{width:38px;height:26px;border:1px solid #ddd;border-radius:4px}
.title{text-align:center;font-size:1.7rem;font-weight:800}
.season{text-align:center;color:var(--muted);margin:12px 0 20px}
.btn{
display:block;
text-align:center;
padding:15px;
border-radius:999px;
background:linear-gradient(90deg,var(--pink),var(--gold));
font-weight:800;
transition:.25s;
}
.card:hover .btn{transform:scale(1.04)}
footer{text-align:center;padding:28px;background:#fff0f6;color:#8c647b}
@media(max-width:700px){
.hero{aspect-ratio:auto;height:60vh;min-height:340px}
.hero img{object-fit:cover;object-position:center top}
.heroContent{margin-top:80px}
}
</style>
</head>
<body>
<header class="hero">
<img src="hero-family.png" alt="משפחת כהן">
<div class="heroContent">
<h1>🌍 המסעות של משפחת כהן</h1>
<p>כל הטיולים שלנו במקום אחד</p>
</div>
</header>

<main>
<div class="intro">
<h2>✈️ בחרו את הטיול הבא</h2>
<p>שלושה מסעות · אינספור זיכרונות</p>
</div>

<div class="grid">

<a class="card" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags">
<img src="at.png" alt="Austria">
<img src="hu.png" alt="Hungary">
</div>
<div class="title">וינה • בודפשט</div>
<div class="season">☀️ קיץ 2026</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags"><img src="cz.png" alt="Czechia"></div>
<div class="title">פראג</div>
<div class="season">🎄 כריסמס 2026</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank">
<div class="cover"><img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1400&q=80"></div>
<div class="content">
<div class="flags"><img src="nl.png" alt="Netherlands"></div>
<div class="title">אמסטרדם והולנד</div>
<div class="season">🌷 פסח 2027</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

</div>
</main>
<footer>❤️ משפחת כהן · 2026</footer>
</body>
</html>
