<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>טיולי משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>

/* ===== Design tokens ===== */
:root{
  --pink:#f8bfd3;
  --rose:#e65182;
  --gold:#f5c66a;
  --navy:#24324a;
  --muted:#6f6f85;
  --shadow: 0 18px 40px rgba(0,0,0,.18);
  --radius-lg: 24px;
  --radius-sm: 4px;
  --content-max: 1150px;
}

/* ===== Reset ===== */
*, *::before, *::after{ margin:0; padding:0; box-sizing:border-box; }
img{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }

/* ===== Base ===== */
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:'Heebo', sans-serif;
  background:linear-gradient(#fff8fb, #ffe8ef, #fff);
  color:var(--navy);
  line-height:1.5;
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}

/* ===== Hero ===== */
.hero{
  position:relative;
  height:clamp(260px, 60vw, 560px);
  overflow:hidden;
  background:#f3e4ea; /* placeholder tone while image loads */
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 30%;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, transparent 55%, rgba(255,248,251,.98));
}

/* ===== Layout ===== */
main{
  max-width:var(--content-max);
  margin:clamp(-50px, -6vw, -70px) auto 0;
  padding:0 20px clamp(40px, 8vw, 60px);
  position:relative;
  z-index:2;
}

.head{
  text-align:center;
  margin-bottom:clamp(20px, 4vw, 28px);
}
.head h2{
  font-size:clamp(1.5rem, 4.5vw, 2rem);
  font-weight:800;
}
.head p{
  color:var(--muted);
  margin-top:6px;
  font-size:clamp(.9rem, 2.5vw, 1rem);
}

/* ===== Trip cards grid ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
  gap:clamp(18px, 3vw, 28px);
}

.card{
  display:block;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .3s ease;
}
.card:hover, .card:focus-visible{
  transform:translateY(-8px);
}
.card:focus-visible{
  outline:3px solid var(--rose);
  outline-offset:3px;
}

.cover{
  height:clamp(160px, 30vw, 210px);
  overflow:hidden;
}
.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .4s ease;
}
.card:hover .cover img{
  transform:scale(1.06);
}

.content{
  padding:clamp(18px, 4vw, 24px);
}

.flags{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:14px;
}
.flags img{
  width:36px;
  height:24px;
  object-fit:cover;
  border-radius:var(--radius-sm);
  border:1px solid #eee;
}

.title{
  text-align:center;
  font-size:clamp(1.35rem, 3.5vw, 1.7rem);
  font-weight:800;
}
.season{
  text-align:center;
  color:var(--muted);
  margin:10px 0 22px;
  font-size:clamp(.9rem, 2.5vw, 1rem);
}

.btn{
  display:block;
  text-align:center;
  background:linear-gradient(90deg, var(--pink), var(--gold));
  padding:14px;
  border-radius:999px;
  font-weight:800;
  color:var(--navy);
}

/* ===== Footer ===== */
footer{
  text-align:center;
  padding:clamp(22px, 5vw, 30px);
  background:#fff0f5;
  color:#8a5570;
  font-size:.95rem;
}

/* ===== Small phones ===== */
@media (max-width:380px){
  .grid{ grid-template-columns:1fr; }
  .flags img{ width:32px; height:21px; }
}

</style>
</head>
<body>

<header class="hero">
  <img
    src="hero-family.png"
    alt="משפחת כהן מחייכים יחד, רקע שקיעה על הרים"
    width="1536" height="1024"
    fetchpriority="high">
</header>

<main>
  <div class="head">
    <h2>✈️ בחרו את הטיול הבא</h2>
    <p>שלושה מסעות, אינספור זיכרונות</p>
  </div>

  <div class="grid">

    <a class="card" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank" rel="noopener">
      <div class="cover">
        <img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1200&q=80"
             alt="וינה ובודפשט" loading="lazy" width="1200" height="800">
      </div>
      <div class="content">
        <div class="flags">
          <img src="at.jpg" alt="אוסטריה" loading="lazy">
          <img src="hu.jpg" alt="הונגריה" loading="lazy">
        </div>
        <div class="title">וינה • בודפשט</div>
        <div class="season">קיץ 2026 ☀️</div>
        <div class="btn">לצפייה במסלול</div>
      </div>
    </a>

    <a class="card" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank" rel="noopener">
      <div class="cover">
        <img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1200&q=80"
             alt="פראג" loading="lazy" width="1200" height="800">
      </div>
      <div class="content">
        <div class="flags">
          <img src="cz.jpg" alt="צ'כיה" loading="lazy">
        </div>
        <div class="title">פראג</div>
        <div class="season">כריסמס 2026 🎄</div>
        <div class="btn">לצפייה במסלול</div>
      </div>
    </a>

    <a class="card" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank" rel="noopener">
      <div class="cover">
        <img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1200&q=80"
             alt="אמסטרדם והולנד" loading="lazy" width="1200" height="800">
      </div>
      <div class="content">
        <div class="flags">
          <img src="nl.jpg" alt="הולנד" loading="lazy">
        </div>
        <div class="title">אמסטרדם והולנד</div>
        <div class="season">פסח 2027 🌷</div>
        <div class="btn">לצפייה במסלול</div>
      </div>
    </a>

  </div>
</main>

<footer>❤️ משפחת כהן · 2026</footer>

</body>
</html>
