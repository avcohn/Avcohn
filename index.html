<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיולי משפחת כהן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
--bg:#fff8fb;--pink:#f8bfd3;--gold:#f5c66a;--navy:#24324a;--muted:#687083;
--radius:26px;--shadow:0 18px 45px rgba(0,0,0,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Heebo,sans-serif;
background:
radial-gradient(circle at top,#ffe6f0 0,#fff7fa 35%,#fff 100%);
color:var(--navy);
overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

.hero{
position:relative;
height:min(78vh,760px);
min-height:420px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#f6e8ee;
}
.hero img{
width:104%;
height:104%;
object-fit:cover;
object-position:center center;
animation:kenburns 16s ease-in-out infinite alternate;
}
.hero:before{
content:"";
position:absolute;
inset:0;
background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(255,248,251,.97));
z-index:1;
}
.hero-title{
position:absolute;
z-index:2;
bottom:70px;
text-align:center;
color:#fff;
text-shadow:0 4px 20px rgba(0,0,0,.4);
padding:0 20px;
}
.hero-title h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:900}
.hero-title p{font-size:1.15rem}

@keyframes kenburns{
0%{transform:scale(1.03) translateY(0)}
100%{transform:scale(1.09) translateY(-10px)}
}

main{
max-width:1180px;
margin:-60px auto 0;
padding:0 20px 60px;
position:relative;
z-index:3;
}
.intro{
text-align:center;
margin-bottom:35px;
}
.intro h2{font-size:2rem}
.intro p{color:var(--muted)}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
gap:28px;
}
.card{
background:rgba(255,255,255,.72);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.7);
border-radius:var(--radius);
overflow:hidden;
box-shadow:var(--shadow);
transition:.35s;
}
.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 28px 60px rgba(0,0,0,.18);
}
.cover{height:220px;overflow:hidden}
.cover img{
width:100%;height:100%;
object-fit:cover;
transition:transform .5s;
}
.card:hover .cover img{transform:scale(1.08)}
.content{padding:22px}
.flags{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:16px;
}
.flags img{
width:38px;
height:26px;
border-radius:4px;
border:1px solid #ddd;
}
.title{
font-size:1.7rem;
font-weight:800;
text-align:center;
}
.season{
text-align:center;
color:var(--muted);
margin:10px 0 22px;
}
.btn{
display:block;
text-align:center;
padding:15px;
border-radius:999px;
background:linear-gradient(90deg,var(--pink),var(--gold));
font-weight:800;
transition:.3s;
}
.card:hover .btn{transform:scale(1.04)}
footer{
padding:30px;
text-align:center;
color:#8d6680;
background:#fff0f5;
}
@media(max-width:700px){
.hero{height:55vh;min-height:320px}
.hero-title h1{font-size:2.3rem}
}
</style>
</head>
<body>

<header class="hero">
<img src="hero-family.png" alt="משפחת כהן">
<div class="hero-title">
<h1>🌍 המסעות של משפחת כהן</h1>
<p>כל הטיולים שלנו במקום אחד</p>
</div>
</header>

<main>

<div class="intro">
<h2>✈️ בחרו את הטיול הבא</h2>
<p>שלושה מסעות • אינספור זיכרונות</p>
</div>

<div class="grid">

<a class="card" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank">
<div class="cover">
<img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1400&q=80">
</div>
<div class="content">
<div class="flags">
<img src="flags/at.png" alt="Austria">
<img src="flags/hu.png" alt="Hungary">
</div>
<div class="title">וינה • בודפשט</div>
<div class="season">קיץ 2026 ☀️</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Xmas26/" target="_blank">
<div class="cover">
<img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1400&q=80">
</div>
<div class="content">
<div class="flags">
<img src="flags/cz.png" alt="Czechia">
</div>
<div class="title">פראג</div>
<div class="season">כריסמס 2026 🎄</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

<a class="card" href="https://avcohn.github.io/Avcohn/Passover27/" target="_blank">
<div class="cover">
<img src="https://images.unsplash.com/photo-1534351590666-13e3e96b5017?auto=format&fit=crop&w=1400&q=80">
</div>
<div class="content">
<div class="flags">
<img src="flags/nl.png" alt="Netherlands">
</div>
<div class="title">אמסטרדם והולנד</div>
<div class="season">פסח 2027 🌷</div>
<div class="btn">לצפייה במסלול →</div>
</div>
</a>

</div>

</main>

<footer>❤️ משפחת כהן · 2026</footer>

</body>
</html>
