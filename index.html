<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טיולי משפחת כהן</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* איפוס בסיסי */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: #0c1d35;
            color: #fff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* אזור פתיח (Hero) */
        .hero {
            position: relative;
            height: 70vh;
            background: linear-gradient(rgba(8, 20, 40, 0.45), rgba(8, 20, 40, 0.75)), 
                        url("https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1800&q=80") center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(12, 29, 53, 1));
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            transform: translateY(-20px);
        }

        .hero-icon {
            font-size: 72px;
            margin-bottom: 10px;
            animation: bounce 2s infinite ease-in-out;
        }

        .hero h1 {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            line-height: 1.1;
        }

        .hero p {
            font-size: 24px;
            opacity: 0.95;
            font-weight: 300;
        }

        /* אזור הסטטיסטיקות (מודגש צף) */
        .stats-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 30px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 20px;
            margin-top: -60px; /* מעלה את הקוביה על הרקע של הפתיח */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .stat {
            text-align: center;
            min-width: 120px;
        }

        .stat h2 {
            font-size: 48px;
            color: #d6a84c;
            line-height: 1;
            margin-bottom: 5px;
        }
        
        .stat div {
            font-size: 18px;
            font-weight: 600;
            opacity: 0.9;
        }

        /* אזור תוכן וכרטיסיות */
        section {
            max-width: 1200px;
            margin: auto;
            padding: 80px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 42px;
            margin-bottom: 50px;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            opacity: 0;
            animation: fadeInUp 0.8s forwards;
        }

        /* דיליי לאנימציית כרטיסיות */
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.3s; }
        .card:nth-child(3) { animation-delay: 0.5s; }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(214, 168, 76, 0.4);
        }

        .image-wrapper {
            overflow: hidden;
            border-radius: 22px 22px 0 0;
        }

        .card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform 0.6s ease;
            display: block;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        .country {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 18px;
            color: #b3bcf5;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .button {
            display: inline-block;
            background: #d6a84c;
            color: #0c1d35;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(214, 168, 76, 0.25);
        }

        .button:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 255, 255, 0.3);
        }

        /* פוקוס במקלדת לנגישות */
        a:focus-visible {
            outline: 3px solid #d6a84c;
            outline-offset: 4px;
        }

        footer {
            padding: 40px;
            text-align: center;
            opacity: 0.7;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        /* אנימציות */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* רספונסיביות */
        @media (max-width: 768px) {
            .hero h1 { font-size: 46px; }
            .hero p { font-size: 20px; }
            .section-title { font-size: 34px; }
            .stats { flex-direction: column; gap: 20px; margin-top: -30px; }
            .content { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <div class="hero-icon">✈️</div>
            <h1>טיולי משפחת כהן</h1>
            <p>כל טיול הוא עוד פרק בסיפור המשפחתי שלנו</p>
        </div>
    </header>

    <div class="stats-wrapper">
        <div class="stats">
            <div class="stat">
                <h2>3</h2>
                <div>מסעות</div>
            </div>
            <div class="stat">
                <h2>4</h2>
                <div>מדינות</div>
            </div>
            <div class="stat">
                <h2>2026</h2>
                <div>שנת ההרפתקאות</div>
            </div>
        </div>
    </div>

    <section>
        <h2 class="section-title">בחרו את היעד</h2>
        <div class="grid">
            
            <!-- וינה ובודפשט -->
            <div class="card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1516550893923-42d28e5677af?auto=format&fit=crop&w=1200&q=80" alt="וינה ובודפשט">
                </div>
                <div class="content">
                    <div class="country">🇦🇹 וינה • 🇭🇺 בודפשט</div>
                    <div class="subtitle">קיץ 2026</div>
                    <a class="button" href="https://avcohn.github.io/Avcohn/Summer26/" target="_blank" rel="noopener noreferrer">פתח את המסלול</a>
                </div>
            </div>

            <!-- פראג -->
            <div class="card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1519677100203-a0e668c92439?auto=format&fit=crop&w=1200&q=80" alt="פראג">
                </div>
                <div class="content">
                    <div class="country">🇨🇿 פראג</div>
                    <div class="subtitle">כריסמס 2026</div>
                    <a class="button" href="PragueChristmas2026.html">פתח את המסלול</a>
                </div>
            </div>

            <!-- הולנד -->
            <div class="card">
                <div class="image-wrapper">
                    <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1200&q=80" alt="הולנד">
                </div>
                <div class="content">
                    <div class="country">🇳🇱 הולנד</div>
                    <div class="subtitle">פסח 2026</div>
                    <a class="button" href="HollandPesach2026.html">פתח את המסלול</a>
                </div>
            </div>

        </div>
    </section>

    <footer>
        משפחת כהן © 2026 • נבנה באהבה ❤️
    </footer>

</body>
</html>
