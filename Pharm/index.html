<nav class="catnav" aria-label="ניווט וחיפוש">
  <div class="catnav-search">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="searchInput" placeholder="חיפוש פריט ברשימה…" aria-label="חיפוש פריט ברשימה">
      <button class="search-clear" id="searchClear" type="button" aria-label="נקה חיפוש">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="catnav-inner" id="catNav"></div>
</nav>

<main>
  <div class="section-title">
    <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h3"/><path d="m15 19 2 2 4-4"/></svg> מדורי אריזה</h2>
    <div class="title-actions">
      <button class="ghost-btn" id="printBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        הדפסה
      </button>
      <button class="ghost-btn danger" id="resetBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        איפוס מלא
      </button>
    </div>
  </div>

  <div class="categories" id="categories"></div>
  <div class="empty-state" id="emptyState" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <p>לא נמצאו פריטים תואמים לחיפוש.</p>
  </div>

</main>

<footer>
  <div class="sprig-divider" aria-hidden="true">
    <span class="bar"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11a8 8 0 0 1 16 0c0 6.5-8 11-8 11z"/></svg>
    <span class="bar"></span>
  </div>
  נשמר אוטומטית במכשיר · טיסה נעימה! ☁️
</footer>

<script>
const DATA = [
  { code:"FEV", name:"חום וכאבים", items:[
    { id:"fev-1", name:"נובימול" },
    { id:"fev-2", name:"נורופן ילדים" },
    { id:"fev-3", name:"נורופן קוויק" },
    { id:"fev-4", name:"כדורי ציפי — אלינור" }
  ]},
  { code:"RSP", name:"נשימה ואינהלציה", items:[
    { id:"rsp-1", name:"מתאם למשאף" },
    { id:"rsp-2", name:"ונטולין — משאף + נוזל" },
    { id:"rsp-3", name:"אינהלציה" },
    { id:"rsp-4", name:"בודיקורט" },
    { id:"rsp-5", name:"מי מלח — בקבוקונים" },
    { id:"rsp-6", name:"תרסיס לאף" }
  ]},
  { code:"E&E", name:"עיניים ואזניים", items:[
    { id:"ee-1", name:"טיפות עיניים" },
    { id:"ee-2", name:"משחת עיניים" },
    { id:"ee-3", name:"טיפות אזניים" },
    { id:"ee-4", name:"נוביקס משחה" },
    { id:"ee-5", name:"מגבוני עיניים" }
  ]},
  { code:"SKN", name:"עור וחיטוי", items:[
    { id:"skn-1", name:"קרן האייל" },
    { id:"skn-2", name:"פלסטרים" },
    { id:"skn-3", name:"אלכוהול ג'ל" },
    { id:"skn-4", name:"פניסטיל" }
  ]},
  { code:"DIG", name:"עיכול", items:[
    { id:"dig-1", name:"ורמוקס" },
    { id:"dig-2", name:"כדורים לצרבת" }
  ]},
  { code:"RX", name:"מרשמים ואנטיביוטיקה", items:[
    { id:"rx-1", name:"אוגמנטין", note:"אנטיביוטיקה" },
    { id:"rx-2", name:"בטנזול — כדורים ורודים", note:"נא לוודא שיש מרשם בתוקף", prescription:true }
  ]},
  { code:"KIT", name:"ציוד עזר", items:[
    { id:"kit-1", name:"מזרקים" },
    { id:"kit-2", name:"כוסית לשתיית תרופות" },
    { id:"kit-3", name:"משטחי גרון" },
    { id:"kit-4", name:"גלולות" }
  ]}
];

const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const WARN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';

const STORAGE_KEY = "flightkit-medications-pink-clouds";

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

let state = loadState();
let searchQuery = "";

const totalItems = () => DATA.reduce((s,c)=>s+c.items.length,0);
const packedItems = () => Object.values(state).filter(Boolean).length;
const rxTotal = () => DATA.reduce((s,c)=>s+c.items.filter(i=>i.prescription).length,0);

function escapeHTML(str){
  return str.replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}
function highlight(name, query){
  const safe = escapeHTML(name);
  if(!query) return safe;
  const i = safe.toLowerCase().indexOf(query.toLowerCase());
  if(i === -1) return safe;
  return safe.slice(0,i) + "<mark>" + safe.slice(i, i+query.length) + "</mark>" + safe.slice(i+query.length);
}

function buildDOM(){
  const catNav = document.getElementById("catNav");
  const categories = document.getElementById("categories");
  catNav.innerHTML = "";
  categories.innerHTML = "";

  DATA.forEach(cat=>{
    const link = document.createElement("a");
    link.href = "#cat-"+cat.code;
    link.id = "nav-"+cat.code;
    link.innerHTML = `<span class="dot"></span>${cat.name}`;
    catNav.appendChild(link);

    const card = document.createElement("div");
    card.className = "tag";
    card.id = "cat-"+cat.code;

    const head = document.createElement("div");
    head.className = "tag-head";
    head.innerHTML = `
      <span class="tag-code">${cat.code}</span>
      <h3>${cat.name}</h3>
      <span class="tag-progress mono" data-cat="${cat.code}"></span>
    `;
    card.appendChild(head);

    const actions = document.createElement("div");
    actions.className = "tag-actions";
    actions.innerHTML = `
      <button type="button" data-action="all" data-cat="${cat.code}">סמן הכל כארוז ✓</button>
      <button type="button" data-action="none" data-cat="${cat.code}">רוקן מדור ✗</button>
    `;
    card.appendChild(actions);

    const list = document.createElement("ul");
    list.className = "item-list";
    cat.items.forEach(item=>{
      const li = document.createElement("li");
      li.className = "item";
      li.dataset.name = item.name;

      const noteHTML = item.prescription
        ? `<span class="flag">${WARN_SVG}${escapeHTML(item.note)}</span>`
        : (item.note ? `<span class="item-note">${escapeHTML(item.note)}</span>` : "");

      li.innerHTML = `
        <label for="${item.id}">
          <input class="check-input sr-only" type="checkbox" id="${item.id}">
          <span class="flap" aria-hidden="true">
            <span class="flap-face flap-front"></span>
            <span class="flap-face flap-back">${CHECK_SVG}</span>
          </span>
          <span class="item-content"><span class="item-name">${escapeHTML(item.name)}</span>${noteHTML}</span>
        </label>
      `;
      list.appendChild(li);

      li.querySelector("input").addEventListener("change",(e)=>{
        state[item.id] = e.target.checked;
        saveState(state);
        li.classList.toggle("packed", e.target.checked);
        updateProgress();
      });
    });

    card.appendChild(list);
    categories.appendChild(card);
  });

  categories.addEventListener("click",(e)=>{
    const btn = e.target.closest("button[data-action]");
    if(!btn) return;
    const cat = DATA.find(c=>c.code === btn.dataset.cat);
    const setTo = btn.dataset.action === "all";
    cat.items.forEach(i=> state[i.id] = setTo);
    saveState(state);
    applyState();
  });

  document.getElementById("rxCount").textContent = rxTotal();
}

function applyState(){
  DATA.forEach(cat=>{
    cat.items.forEach(item=>{
      const input = document.getElementById(item.id);
      if(!input) return;
      const packed = !!state[item.id];
      input.checked = packed;
      input.closest(".item").classList.toggle("packed", packed);
    });
  });
  updateProgress();
}

function updateProgress(){
  const total = totalItems();
  const packed = packedItems();
  const pct = total === 0 ? 0 : Math.round((packed/total)*100);

  document.getElementById("progressFraction").textContent = `${packed}/${total}`;
  const runwayFill = document.getElementById("runwayFill");
  runwayFill.style.width = pct + "%";

  runwayFill.classList.toggle("taking-off", pct === 100);

  document.getElementById("miniText").textContent = `${packed}/${total} ארוז`;
  document.getElementById("miniFill").style.width = pct + "%";
  document.getElementById("miniStatus").textContent = pct === 100 ? "✨" : "☁️";

  DATA.forEach(cat=>{
    const packedInCat = cat.items.filter(i=>state[i.id]).length;
    const isComplete = packedInCat === cat.items.length && cat.items.length > 0;

    const progEl = document.querySelector(`.tag-progress[data-cat="${cat.code}"]`);
    if(progEl) progEl.textContent = isComplete ? "הושלם" : `${packedInCat}/${cat.items.length}`;

    const cardEl = document.getElementById("cat-"+cat.code);
    if(cardEl) cardEl.classList.toggle("completed", isComplete);

    const navEl = document.getElementById("nav-"+cat.code);
    if(navEl) navEl.classList.toggle("complete", isComplete);
  });
}

function setupActiveNav(){
  if(!("IntersectionObserver" in window)) return;
  const sections = DATA.map(c => document.getElementById("cat-"+c.code)).filter(Boolean);
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const navEl = document.getElementById("nav-"+entry.target.id.replace("cat-",""));
      if(!navEl) return;
      if(entry.isIntersecting){
        document.querySelectorAll(".catnav a").forEach(a=>a.classList.remove("active"));
        navEl.classList.add("active");
        navEl.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
      }
    });
  }, { rootMargin: "-40% 0px -50% 0px", threshold: 0 });
  sections.forEach(s => observer.observe(s));
}

function setupMiniBar(){
  const hero = document.querySelector(".hero");
  const miniBar = document.getElementById("miniBar");
  if(!("IntersectionObserver" in window) || !hero){ return; }
  const observer = new IntersectionObserver(([entry])=>{
    miniBar.classList.toggle("show", !entry.isIntersecting);
  }, { threshold: 0 });
  observer.observe(hero);
}

function setupSearch(){
  const input = document.getElementById("searchInput");
  const clearBtn = document.getElementById("searchClear");
  const emptyState = document.getElementById("emptyState");
  const categories = document.getElementById("categories");

  function applySearch(){
    const q = searchQuery.trim();
    clearBtn.classList.toggle("show", q.length > 0);
    let anyVisible = false;

    DATA.forEach(cat=>{
      const card = document.getElementById("cat-"+cat.code);
      const navEl = document.getElementById("nav-"+cat.code);
      let catHasMatch = false;

      cat.items.forEach(item=>{
        const li = card.querySelector(`#${item.id}`).closest(".item");
        const match = !q || item.name.toLowerCase().includes(q.toLowerCase());
        li.classList.toggle("hidden-by-search", !match);
        li.querySelector(".item-name").innerHTML = highlight(item.name, q);
        if(match) catHasMatch = true;
      });

      card.classList.toggle("hidden-by-search", !catHasMatch);
      if(navEl) navEl.classList.toggle("no-match", !catHasMatch);
      if(catHasMatch) anyVisible = true;
    });

    emptyState.hidden = anyVisible || !q;
    categories.hidden = !anyVisible && !!q;
  }

  input.addEventListener("input",(e)=>{
    searchQuery = e.target.value;
    applySearch();
  });
  clearBtn.addEventListener("click",()=>{
    searchQuery = "";
    input.value = "";
    input.focus();
    applySearch();
  });
}

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("האם לאפס את כל הרשימה ולהתחיל מחדש?")){
    state = {};
    saveState(state);
    applyState();
  }
});

document.getElementById("printBtn").addEventListener("click", ()=> window.print());

buildDOM();
applyState();
setupActiveNav();
setupMiniBar();
setupSearch();
</script>

</body>
</html>
