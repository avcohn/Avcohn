<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הקופה של אלמה ואליאנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Playpen+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8f2;
    --alma: #93b56e;
    --alma-soft: #eaf3e0;
    --eliana: #de8a9b;
    --eliana-soft: #fbe9ee;
    --title: #2f6a73;
    --ink: #3a3530;
    --ink-soft: #948b81;
    --gold: #cd9f4c;
    --card: #ffffff;
    --ring: rgba(205, 159, 76, .35);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Rubik', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffeee0 0%, transparent 45%),
      radial-gradient(circle at 88% 92%, #eef4e6 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 28px 16px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ---------- Header ---------- */
  .header {
    text-align: center;
    margin-bottom: 26px;
    animation: dropIn .6s cubic-bezier(.2,.9,.3,1.2);
  }

  .logo {
    display: block;
    margin: 0 auto;
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #fff;
    box-shadow: 0 18px 40px rgba(60, 40, 20, .22);
    animation: float 5s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: .95rem;
    margin: 0;
  }

  /* ---------- Currency control ---------- */
  .controls {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    padding: 10px 20px;
    border-radius: 50px;
    box-shadow: 0 6px 18px rgba(60, 40, 20, .08);
    margin: 18px auto 8px;
    font-size: .95rem;
  }

  select {
    font-family: inherit;
    font-size: .95rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid var(--title);
    background: #fff;
    color: var(--title);
    font-weight: 600;
    cursor: pointer;
    outline: none;
    transition: box-shadow .15s;
  }
  select:focus-visible { box-shadow: 0 0 0 3px var(--ring); }

  .rate-info {
    text-align: center;
    font-size: .78rem;
    color: var(--ink-soft);
    margin-bottom: 30px;
    min-height: 1.2em;
  }
  .rate-info.stale { color: var(--eliana); }

  /* ---------- Kid cards ---------- */
  .kids-container {
    display: flex;
    flex-wrap: wrap;
    gap: 26px;
    justify-content: center;
  }

  .kid-card {
    background: var(--card);
    flex: 1;
    min-width: 300px;
    max-width: 480px;
    border-radius: 28px;
    padding: 28px 26px 24px;
    box-shadow: 0 14px 34px rgba(60, 40, 20, .09);
    position: relative;
    overflow: hidden;
    animation: dropIn .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .kid-card.eliana { animation-delay: .08s; }

  .kid-card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 8px;
  }
  .kid-card.alma::before { background: var(--alma); }
  .kid-card.eliana::before { background: var(--eliana); }

  .kid-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .kid-name {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-weight: 700;
    font-size: 2rem;
    margin: 4px 0 0;
  }
  .alma .kid-name { color: var(--alma); }
  .eliana .kid-name { color: var(--eliana); }

  .kid-emoji { font-size: 1.6rem; }

  .balance {
    font-family: 'Playpen Sans Hebrew', cursive;
    font-size: 3rem;
    font-weight: 700;
    margin: 4px 0 2px;
    direction: ltr;
    display: block;
    transition: transform .25s;
  }
  .balance.bump { transform: scale(1.08); }
  .alma .balance { color: var(--alma); }
  .eliana .balance { color: var(--eliana); }

  .balance-label {
    font-size: .8rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .btn-reset {
    background: none;
    border: 1.5px solid #e7e0d5;
    color: var(--ink-soft);
    font-size: .72rem;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    flex: none;
    transition: border-color .15s, color .15s;
  }
  .btn-reset:hover { border-color: var(--eliana); color: #c0433e; }

  /* ---------- Goal ---------- */
  .goal-section {
    background: #faf7f2;
    padding: 16px 18px;
    border-radius: 18px;
    margin: 18px 0;
  }

  .goal-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 600;
    font-size: .92rem;
  }
  .goal-title span[dir="ltr"] { color: var(--gold); font-weight: 700; }

  .progress-bar-container {
    width: 100%;
    height: 22px;
    background-color: #e9e3d8;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    transition: width .6s cubic-bezier(.2,.8,.3,1);
    position: relative;
    overflow: hidden;
  }
  .alma .progress-bar { background: linear-gradient(90deg, var(--alma), #b6d494); }
  .eliana .progress-bar { background: linear-gradient(90deg, var(--eliana), #f0aebd); }

  .progress-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 2.4s infinite;
  }

  .progress-bar.full::before {
    content: '🎉';
    position: absolute;
    left: 6px;
    top: -1px;
    font-size: .95rem;
  }

  .goal-edit {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .goal-edit input { flex: 1; }

  .btn-update-goal {
    background: var(--title);
    padding: 0 16px;
    font-size: .85rem;
    white-space: nowrap;
  }

  /* ---------- Actions ---------- */
  .actions { margin: 18px 0 6px; }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  label.field-label {
    display: block;
    font-size: .75rem;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  input[type="text"], input[type="number"] {
    font-family: inherit;
    padding: 11px 13px;
    border: 1.5px solid #e7e0d5;
    border-radius: 12px;
    font-size: .95rem;
    width: 100%;
    background: #fffdfa;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus-visible, input:focus {
    outline: none;
    border-color: var(--title);
    box-shadow: 0 0 0 3px var(--ring);
  }

  .btn-group { display: flex; gap: 10px; }

  button {
    font-family: inherit;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
    color: white;
    transition: transform .08s, opacity .2s, box-shadow .15s;
  }
  button:active { transform: scale(.96); }
  button:hover { opacity: .92; }
  button:focus-visible { box-shadow: 0 0 0 3px var(--ring); outline: none; }

  .btn-add { background-color: #6fa34a; }
  .btn-spend { background-color: #d9645f; }

  /* ---------- History ---------- */
  .history-section {
    margin-top: 22px;
    border-top: 2px dashed #eee2d2;
    padding-top: 14px;
  }

  .history-title {
    font-size: .9rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .history-list {
    max-height: 220px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 4px;
    border-bottom: 1px solid #f2ede4;
    font-size: .92rem;
    animation: fadeIn .3s;
  }

  .history-item .desc-wrap { min-width: 0; }
  .history-item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item.add strong ~ .history-date {}
  .history-item.add span[dir="ltr"] { color: #4c8a2e; }
  .history-item.spend span[dir="ltr"] { color: #c0433e; }
  .history-date { font-size: .74rem; color: var(--ink-soft); }

  .history-right { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

  .del-btn {
    background: none;
    border: none;
    color: #c9beb1;
    font-size: .95rem;
    cursor: pointer;
    padding: 2px 6px;
    flex: none;
    line-height: 1;
  }
  .del-btn:hover { color: #c0433e; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-size: .88rem;
    padding: 18px 0;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--title);
    color: #fff;
    padding: 12px 22px;
    border-radius: 40px;
    font-size: .9rem;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Animations ---------- */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 600px) {
    .input-group, .btn-group, .goal-edit { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <img src="logo.png" alt="הקופה של אלמה ואליאנה" class="logo">

    <div class="controls">
      <label for="currency-select">מטבע:</label>
      <select id="currency-select" onchange="changeCurrency()">
        <option value="ILS">🇮🇱 ₪ שקל חדש</option>
        <option value="EUR">🇪🇺 € אירו</option>
        <option value="HUF">🇭🇺 Ft פורינט הונגרי</option>
      </select>
    </div>
    <div class="rate-info" id="rate-display">טוען שערי חליפין...</div>
  </div>

  <div class="kids-container">
    <!-- כרטיס אלמה -->
    <div class="kid-card alma">
      <div class="kid-header">
        <h2 class="kid-name">אלמה</h2>
        <span class="kid-emoji">🌿</span>
      </div>
      <div class="balance-label">
        <span>יתרה נוכחית</span>
        <button class="btn-reset" onclick="resetBalance('alma')">↺ איפוס קופה</button>
      </div>
      <span class="balance" id="alma-balance" aria-live="polite">0</span>

      <div class="goal-section">
        <div class="goal-title">
          <span>💸 תקציב להוצאות ובזבוזים</span>
          <span id="alma-goal-display" dir="ltr">0</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="alma-progress"></div>
        </div>
        <div class="goal-edit">
          <input type="number" id="alma-new-goal" placeholder="סכום...">
          <button class="btn-update-goal" onclick="updateGoal('alma')">הגדרת סכום</button>
        </div>
      </div>

      <div class="actions">
        <div class="input-group">
          <input type="text" id="alma-desc" placeholder="מה עשינו? (למשל: דמי כיס / גלידה)" onkeydown="if(event.key==='Enter'){document.getElementById('alma-amount').focus()}">
          <input type="number" id="alma-amount" placeholder="סכום" min="0" step="0.5" onkeydown="if(event.key==='Enter'){addTransaction('alma','add')}">
        </div>
        <div class="btn-group">
          <button class="btn-add" onclick="addTransaction('alma', 'add')">➕ הוספת כסף</button>
          <button class="btn-spend" onclick="addTransaction('alma', 'spend')">➖ הוצאה</button>
        </div>
      </div>

      <div class="history-section">
        <h3 class="history-title">📜 היסטוריה</h3>
        <div class="history-list" id="alma-history"></div>
      </div>
    </div>

    <!-- כרטיס אליאנה -->
    <div class="kid-card eliana">
      <div class="kid-header">
        <h2 class="kid-name">אליאנה</h2>
        <span class="kid-emoji">💗</span>
      </div>
      <div class="balance-label">
        <span>יתרה נוכחית</span>
        <button class="btn-reset" onclick="resetBalance('eliana')">↺ איפוס קופה</button>
      </div>
      <span class="balance" id="eliana-balance" aria-live="polite">0</span>

      <div class="goal-section">
        <div class="goal-title">
          <span>💸 תקציב להוצאות ובזבוזים</span>
          <span id="eliana-goal-display" dir="ltr">0</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="eliana-progress"></div>
        </div>
        <div class="goal-edit">
          <input type="number" id="eliana-new-goal" placeholder="סכום...">
          <button class="btn-update-goal" onclick="updateGoal('eliana')">הגדרת סכום</button>
        </div>
      </div>

      <div class="actions">
        <div class="input-group">
          <input type="text" id="eliana-desc" placeholder="מה עשינו? (למשל: דמי כיס / גלידה)" onkeydown="if(event.key==='Enter'){document.getElementById('eliana-amount').focus()}">
          <input type="number" id="eliana-amount" placeholder="סכום" min="0" step="0.5" onkeydown="if(event.key==='Enter'){addTransaction('eliana','add')}">
        </div>
        <div class="btn-group">
          <button class="btn-add" onclick="addTransaction('eliana', 'add')">➕ הוספת כסף</button>
          <button class="btn-spend" onclick="addTransaction('eliana', 'spend')">➖ הוצאה</button>
        </div>
      </div>

      <div class="history-section">
        <h3 class="history-title">📜 היסטוריה</h3>
        <div class="history-list" id="eliana-history"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // מצב האפליקציה. הכל נשמר בשקלים מאחורי הקלעים ומומר לתצוגה לפי המטבע שנבחר.
  let appData = {
    currentCurrency: 'ILS',
    alma: { balanceILS: 0, goalILS: 100, history: [] },
    eliana: { balanceILS: 0, goalILS: 100, history: [] }
  };

  let exchangeRates = { ILS: 1, EUR: 0.25, HUF: 95.0 };
  const currencySymbols = { ILS: '₪', EUR: '€', HUF: 'Ft' };
  const STORAGE_KEY = 'kidsBudgetAppData';
  const RATES_KEY = 'kidsBudgetRates';

  async function init() {
    loadData();
    document.getElementById('currency-select').value = appData.currentCurrency;
    loadCachedRates();
    updateUI();
    await fetchRates();
    updateUI();
  }

  // שימוש בשערים שנשמרו לפני שהרשת עונה, כדי שהמסך לא יהיה ריק
  function loadCachedRates() {
    try {
      const cached = JSON.parse(localStorage.getItem(RATES_KEY));
      if (cached && cached.rates) {
        exchangeRates = cached.rates;
        setRateDisplay(cached.timestamp, true);
      }
    } catch (e) { /* אין נתונים שמורים - לא נורא */ }
  }

  async function fetchRates() {
    try {
      const response = await fetch('https://open.er-api.com/v6/latest/ILS');
      const data = await response.json();
      exchangeRates = { ILS: 1, EUR: data.rates.EUR, HUF: data.rates.HUF };
      localStorage.setItem(RATES_KEY, JSON.stringify({ rates: exchangeRates, timestamp: Date.now() }));
      setRateDisplay(Date.now(), false);
    } catch (error) {
      console.error('שגיאה בטעינת שערי חליפין', error);
      const el = document.getElementById('rate-display');
      el.classList.add('stale');
      el.innerText = exchangeRates.EUR !== 0.25
        ? 'אין חיבור לרשת - מוצגים השערים האחרונים שנשמרו'
        : 'אין חיבור לרשת - מוצגים שערים משוערים';
    }
  }

  function setRateDisplay(timestamp, isCached) {
    const el = document.getElementById('rate-display');
    el.classList.toggle('stale', isCached);
    const prefix = isCached ? 'שערים (מהפעם הקודמת): ' : 'שערים מעודכנים: ';
    el.innerText = `${prefix}1₪ = ${exchangeRates.EUR.toFixed(2)}€ | 1₪ = ${exchangeRates.HUF.toFixed(1)}Ft`;
  }

  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { appData = JSON.parse(saved); } catch (e) { /* נתונים פגומים - ממשיכים עם ברירת מחדל */ }
    }
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function changeCurrency() {
    appData.currentCurrency = document.getElementById('currency-select').value;
    saveData();
    updateUI();
  }

  function convertFromILS(amountILS) {
    return amountILS * exchangeRates[appData.currentCurrency];
  }

  function convertToILS(amountLocal) {
    return amountLocal / exchangeRates[appData.currentCurrency];
  }

  function formatCurrency(amount) {
    const sym = currencySymbols[appData.currentCurrency];
    if (appData.currentCurrency === 'HUF') {
      return Math.round(amount).toLocaleString() + ' ' + sym;
    }
    return amount.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ' + sym;
  }

  function updateGoal(kid) {
    const name = kid === 'alma' ? 'אלמה' : 'אליאנה';
    const inputElement = document.getElementById(`${kid}-new-goal`);
    const newAmountLocal = parseFloat(inputElement.value);

    if (isNaN(newAmountLocal) || newAmountLocal <= 0) {
      showToast('נא להזין סכום תקין');
      return;
    }

    const newAmountILS = convertToILS(newAmountLocal);
    const currentBalanceILS = appData[kid].balanceILS;

    if (currentBalanceILS !== 0) {
      const currentLocal = formatCurrency(convertFromILS(currentBalanceILS));
      if (!confirm(`יש כרגע ${currentLocal} בקופה של ${name}. להחליף לסכום החדש (${formatCurrency(newAmountLocal)})?`)) return;
    }

    // רושמים בהיסטוריה את ההפרש, כדי שהיתרה תמיד תשקף את מה שבאמת קרה
    const diffILS = newAmountILS - currentBalanceILS;
    if (diffILS !== 0) {
      appData[kid].history.unshift({
        id: Date.now(),
        desc: `הגדרת סכום: ${formatCurrency(newAmountLocal)}`,
        amountILS: Math.abs(diffILS),
        type: diffILS > 0 ? 'add' : 'spend',
        date: new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      });
    }

    appData[kid].goalILS = newAmountILS;
    appData[kid].balanceILS = newAmountILS;
    inputElement.value = '';
    saveData();
    updateUI();
    bumpBalance(kid);
    showToast(`הסכום של ${name} הוגדר ל-${formatCurrency(newAmountLocal)} ✨`);
  }

  function addTransaction(kid, type) {
    const descInput = document.getElementById(`${kid}-desc`);
    const amountInput = document.getElementById(`${kid}-amount`);

    const desc = descInput.value.trim() || (type === 'add' ? 'הפקדה' : 'הוצאה');
    const amountLocal = parseFloat(amountInput.value);

    if (isNaN(amountLocal) || amountLocal <= 0) {
      showToast('נא להזין סכום תקין');
      return;
    }

    const amountILS = convertToILS(amountLocal);

    if (type === 'spend' && appData[kid].balanceILS < amountILS) {
      if (!confirm('זהירות: אין מספיק כסף בקופה! להמשיך ולהיכנס למינוס?')) return;
    }

    appData[kid].balanceILS += (type === 'add' ? amountILS : -amountILS);

    appData[kid].history.unshift({
      id: Date.now(),
      desc: desc,
      amountILS: amountILS,
      type: type,
      date: new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    });

    descInput.value = '';
    amountInput.value = '';
    saveData();
    updateUI();
    bumpBalance(kid);
  }

  function deleteTransaction(kid, id) {
    if (!confirm('למחוק את הפעולה הזו?')) return;
    const item = appData[kid].history.find(h => h.id === id);
    if (!item) return;
    appData[kid].balanceILS += (item.type === 'add' ? -item.amountILS : item.amountILS);
    appData[kid].history = appData[kid].history.filter(h => h.id !== id);
    saveData();
    updateUI();
  }

  function resetBalance(kid) {
    const name = kid === 'alma' ? 'אלמה' : 'אליאנה';
    if (!confirm(`לאפס את הקופה של ${name} ל-0? הפעולה לא ניתנת לביטול (ההיסטוריה תישמר).`)) return;

    if (appData[kid].balanceILS !== 0) {
      appData[kid].history.unshift({
        id: Date.now(),
        desc: 'איפוס קופה',
        amountILS: Math.abs(appData[kid].balanceILS),
        type: appData[kid].balanceILS > 0 ? 'spend' : 'add',
        date: new Date().toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      });
    }

    appData[kid].balanceILS = 0;
    saveData();
    updateUI();
    bumpBalance(kid);
    showToast(`הקופה של ${name} אופסה`);
  }

  function bumpBalance(kid) {
    const el = document.getElementById(`${kid}-balance`);
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 250);
  }

  function updateUI() {
    ['alma', 'eliana'].forEach(kid => {
      const balanceLocal = convertFromILS(appData[kid].balanceILS);
      const goalLocal = convertFromILS(appData[kid].goalILS);

      document.getElementById(`${kid}-balance`).innerText = formatCurrency(balanceLocal);
      document.getElementById(`${kid}-goal-display`).innerText = formatCurrency(goalLocal);

      const progressElement = document.getElementById(`${kid}-progress`);
      let percent = 0;
      if (appData[kid].goalILS > 0) {
        percent = (appData[kid].balanceILS / appData[kid].goalILS) * 100;
        percent = Math.max(0, Math.min(100, percent));
      }
      progressElement.style.width = `${percent}%`;
      progressElement.classList.toggle('full', percent >= 100);

      const historyContainer = document.getElementById(`${kid}-history`);
      historyContainer.innerHTML = '';

      if (appData[kid].history.length === 0) {
        historyContainer.innerHTML = '<div class="empty-state">עוד לא נרשמו פעולות 🐷</div>';
        return;
      }

      appData[kid].history.forEach(item => {
        const itemAmountLocal = convertFromILS(item.amountILS);
        const sign = item.type === 'add' ? '+' : '-';
        const div = document.createElement('div');
        div.className = `history-item ${item.type}`;
        div.innerHTML = `
          <span class="desc-wrap">
            <strong>${escapeHtml(item.desc)}</strong>
            <span class="history-date">${item.date}</span>
          </span>
          <span class="history-right">
            <span dir="ltr">${sign} ${formatCurrency(itemAmountLocal)}</span>
            <button class="del-btn" title="מחיקה" aria-label="מחיקת פעולה" onclick="deleteTransaction('${kid}', ${item.id})">✕</button>
          </span>
        `;
        historyContainer.appendChild(div);
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  window.onload = init;
</script>
</body>
</html>
